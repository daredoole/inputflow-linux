<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">InputFlow pairing helper screenshot</title>
  <desc id="desc">Mock screenshot showing the Linux export-windows-pair command and the matching PowerShell helper on Windows.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10242f"/>
      <stop offset="100%" stop-color="#1e4b5b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#0b1820" flood-opacity="0.35"/>
    </filter>
    <style>
      .label { font: 700 18px 'DejaVu Sans Mono', monospace; fill: #d4f4ff; letter-spacing: 0.06em; }
      .title { font: 700 42px 'DejaVu Sans', sans-serif; fill: #f6fbfd; }
      .body  { font: 500 20px 'DejaVu Sans', sans-serif; fill: #dce8ed; }
      .code  { font: 500 19px 'DejaVu Sans Mono', monospace; fill: #dff7b3; }
      .muted { font: 500 18px 'DejaVu Sans', sans-serif; fill: #9fc0c9; }
      .small { font: 500 16px 'DejaVu Sans Mono', monospace; fill: #9bd6e5; }
    </style>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="1130" cy="110" r="160" fill="#98d9c21c"/>
  <circle cx="150" cy="640" r="220" fill="#d7ef7815"/>

  <text x="80" y="96" class="label">PUBLIC BETA SETUP</text>
  <text x="80" y="150" class="title">Generate the Windows pairing helper from Linux</text>
  <text x="80" y="190" class="body">The exported helper keeps the shared key off screenshots and fills in the Linux machine name, IP, and layout slot for PowerToys.</text>

  <g filter="url(#shadow)">
    <rect x="80" y="250" width="540" height="350" rx="24" fill="#0d1720" stroke="#33515e"/>
    <rect x="80" y="250" width="540" height="54" rx="24" fill="#152431"/>
    <circle cx="116" cy="277" r="8" fill="#ef7668"/>
    <circle cx="144" cy="277" r="8" fill="#f1c453"/>
    <circle cx="172" cy="277" r="8" fill="#63c15d"/>
    <text x="205" y="284" class="muted">Fedora terminal</text>

    <text x="108" y="346" class="code">$ ./build/mwb_client export-windows-pair \</text>
    <text x="140" y="378" class="code">--config ~/.config/mwb-client/config.ini \</text>
    <text x="140" y="410" class="code">--position top-left</text>
    <text x="108" y="468" class="small">Wrote inputflow-windows-pair-fedora.ps1</text>
    <text x="108" y="500" class="small">Embedded values:</text>
    <text x="140" y="532" class="small">machine_name = fedora</text>
    <text x="140" y="560" class="small">linux_ip     = 192.0.2.50</text>
    <text x="140" y="588" class="small">position     = top-left</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="680" y="250" width="520" height="350" rx="24" fill="#f4f0e8" stroke="#c5baa7"/>
    <rect x="680" y="250" width="520" height="54" rx="24" fill="#e7dfd1"/>
    <text x="712" y="284" class="muted" fill="#5e513e">Windows PowerShell</text>

    <text x="710" y="346" class="code" fill="#264653">&gt; powershell -ExecutionPolicy Bypass \</text>
    <text x="742" y="378" class="code" fill="#264653">-File .\inputflow-windows-pair-fedora.ps1 \</text>
    <text x="742" y="410" class="code" fill="#264653">-ClosePowerToys</text>

    <rect x="710" y="450" width="458" height="110" rx="18" fill="#ffffff"/>
    <text x="740" y="492" class="small" fill="#30505f">Updated PowerToys settings:</text>
    <text x="740" y="522" class="small" fill="#30505f">MachineMatrixString: WIN-PC,fedora,,</text>
    <text x="740" y="548" class="small" fill="#30505f">MachinePool: WIN-PC:NONE,fedora:NONE,:,: </text>
  </g>

  <text x="80" y="660" class="muted">The current beta still uses the historical `mwb_client` binary and service names for compatibility.</text>
</svg>
