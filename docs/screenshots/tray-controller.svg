<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">InputFlow tray and desktop controller screenshot</title>
  <desc id="desc">Mock screenshot showing the Linux tray status and the desktop controller actions for service status, pairing, and diagnostics.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14141b"/>
      <stop offset="100%" stop-color="#28313d"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.30"/>
    </filter>
    <style>
      .label { font: 700 18px 'DejaVu Sans Mono', monospace; fill: #c6d6e4; letter-spacing: 0.06em; }
      .title { font: 700 42px 'DejaVu Sans', sans-serif; fill: #f8fbfd; }
      .body  { font: 500 20px 'DejaVu Sans', sans-serif; fill: #d2dbe2; }
      .menu  { font: 600 22px 'DejaVu Sans', sans-serif; fill: #11212b; }
      .small { font: 500 17px 'DejaVu Sans', sans-serif; fill: #8db0c1; }
    </style>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <text x="80" y="96" class="label">LINUX OPERATIONS</text>
  <text x="80" y="150" class="title">Ship the service, tray, and controller as one workflow</text>
  <text x="80" y="190" class="body">Public beta users need a safe path to connect, verify status, inspect logs, and export the Windows helper without editing files by hand.</text>

  <g filter="url(#shadow)">
    <rect x="118" y="278" width="330" height="250" rx="28" fill="#f7fafb"/>
    <text x="160" y="334" class="menu">InputFlow tray</text>
    <circle cx="173" cy="388" r="12" fill="#65c36f"/>
    <text x="200" y="396" class="menu">Connected to WIN-PC</text>
    <circle cx="173" cy="438" r="12" fill="#78a7ff"/>
    <text x="200" y="446" class="menu">Clipboard enabled</text>
    <circle cx="173" cy="488" r="12" fill="#f0b552"/>
    <text x="200" y="496" class="menu">Open controller</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="520" y="238" width="610" height="360" rx="28" fill="#0e1820" stroke="#35505e"/>
    <text x="562" y="294" class="body">Desktop controller</text>
    <rect x="562" y="328" width="526" height="60" rx="16" fill="#172834"/>
    <text x="590" y="366" class="body">Service status: active</text>
    <rect x="562" y="406" width="250" height="58" rx="16" fill="#9dc86a"/>
    <text x="598" y="443" class="menu">Export Windows helper</text>
    <rect x="838" y="406" width="250" height="58" rx="16" fill="#78c6d3"/>
    <text x="900" y="443" class="menu">Run doctor</text>
    <rect x="562" y="484" width="526" height="76" rx="16" fill="#172834"/>
    <text x="590" y="522" class="small">Known peer: WIN-PC</text>
    <text x="590" y="548" class="small">Pairing helper: inputflow-windows-pair-fedora.ps1</text>
  </g>
</svg>
