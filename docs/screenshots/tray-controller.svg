<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">How the InputFlow tray, controller, and service work together</title>
  <desc id="desc">The tray provides status and quick actions, while the desktop controller handles pairing and diagnostics. Both control the mwb-client background service.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111720"/>
      <stop offset="100%" stop-color="#1d2935"/>
    </linearGradient>
    <linearGradient id="service" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#173849"/>
      <stop offset="100%" stop-color="#17352f"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#05080b" flood-opacity="0.34"/>
    </filter>
    <style>
      .eyebrow { font: 700 16px 'DejaVu Sans Mono', monospace; fill: #8fc8d3; letter-spacing: 0.10em; }
      .headline { font: 700 42px 'DejaVu Sans', sans-serif; fill: #f7fafc; }
      .lede { font: 500 19px 'DejaVu Sans', sans-serif; fill: #bac7d1; }
      .card-kicker { font: 700 14px 'DejaVu Sans Mono', monospace; fill: #6ec5d4; letter-spacing: 0.08em; }
      .card-title { font: 700 25px 'DejaVu Sans', sans-serif; fill: #eef4f7; }
      .card-copy { font: 500 18px 'DejaVu Sans', sans-serif; fill: #b9c8d2; }
      .service-kicker { font: 700 14px 'DejaVu Sans Mono', monospace; fill: #9cd06c; letter-spacing: 0.08em; }
      .service-title { font: 700 27px 'DejaVu Sans', sans-serif; fill: #f4f8f6; }
      .service-copy { font: 500 18px 'DejaVu Sans', sans-serif; fill: #c1d2ce; }
      .connector-label { font: 700 13px 'DejaVu Sans Mono', monospace; fill: #7694a4; letter-spacing: 0.06em; }
    </style>
  </defs>

  <rect width="1280" height="720" fill="url(#background)"/>

  <text x="72" y="78" class="eyebrow">LINUX WORKFLOW</text>
  <text x="72" y="132" class="headline">One service. Two clear control surfaces.</text>
  <text x="72" y="174" class="lede">Use the tray for status and quick actions.</text>
  <text x="72" y="204" class="lede">Open the controller for pairing, diagnostics, and exports.</text>

  <g filter="url(#shadow)">
    <rect x="88" y="258" width="476" height="202" rx="24" fill="#13222d" stroke="#31505e"/>
    <circle cx="132" cy="306" r="17" fill="#102d35" stroke="#64c3d2" stroke-width="3"/>
    <circle cx="132" cy="306" r="6" fill="#64c3d2"/>
    <text x="166" y="302" class="card-kicker">QUICK STATUS</text>
    <text x="124" y="351" class="card-title">InputFlow tray</text>
    <circle cx="132" cy="390" r="5" fill="#68c67a"/>
    <text x="151" y="397" class="card-copy">Connection and clipboard state</text>
    <circle cx="132" cy="426" r="5" fill="#68c67a"/>
    <text x="151" y="433" class="card-copy">Start, stop, or open the controller</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="716" y="258" width="476" height="202" rx="24" fill="#13222d" stroke="#31505e"/>
    <rect x="758" y="289" width="34" height="34" rx="8" fill="#102d35" stroke="#64c3d2" stroke-width="3"/>
    <path d="M766 300 H784 M766 307 H779 M766 314 H782" fill="none" stroke="#64c3d2" stroke-width="3" stroke-linecap="round"/>
    <text x="814" y="302" class="card-kicker">SETUP &amp; SUPPORT</text>
    <text x="752" y="351" class="card-title">Desktop controller</text>
    <circle cx="760" cy="390" r="5" fill="#68c67a"/>
    <text x="779" y="397" class="card-copy">Pair a Windows PC</text>
    <circle cx="760" cy="426" r="5" fill="#68c67a"/>
    <text x="779" y="433" class="card-copy">Run doctor or export the helper</text>
  </g>

  <path d="M326 460 V486 Q326 500 340 500 H522 Q536 500 536 516" fill="none" stroke="#4b8fa0" stroke-width="4" stroke-linecap="round"/>
  <path d="M954 460 V486 Q954 500 940 500 H758 Q744 500 744 516" fill="none" stroke="#4b8fa0" stroke-width="4" stroke-linecap="round"/>
  <text x="558" y="500" class="connector-label">CONTROLS</text>

  <g filter="url(#shadow)">
    <rect x="246" y="516" width="788" height="132" rx="26" fill="url(#service)" stroke="#4a7167"/>
    <rect x="286" y="551" width="64" height="62" rx="14" fill="#10252c" stroke="#75b981" stroke-width="3"/>
    <path d="M303 568 H333 M303 582 H333 M303 596 H322" fill="none" stroke="#9cd06c" stroke-width="4" stroke-linecap="round"/>
    <text x="378" y="559" class="service-kicker">ALWAYS-ON CORE</text>
    <text x="378" y="596" class="service-title">mwb-client service</text>
    <text x="378" y="625" class="service-copy">Discovery  ·  input relay  ·  clipboard sync</text>
  </g>
</svg>
