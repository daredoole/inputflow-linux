version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: America/New_York
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: America/New_York
    open-pull-requests-limit: 10
    groups:
      android-dependencies:
        patterns: ["*"]
