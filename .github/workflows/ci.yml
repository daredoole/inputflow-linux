name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu-build:
    name: Ubuntu build and tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            libx11-dev \
            libssl-dev \
            pkg-config \
            zlib1g-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  fedora-build:
    name: Fedora build and tests
    runs-on: ubuntu-latest
    container:
      image: fedora:latest

    steps:
      - name: Install Git for checkout
        run: dnf install -y git

      - name: Check out source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          dnf install -y \
            cmake \
            gcc-c++ \
            gtk3-devel \
            libayatana-appindicator3-devel \
            libX11-devel \
            make \
            openssl-devel \
            pkgconf-pkg-config \
            rpm-build \
            systemd-rpm-macros \
            zlib-devel

      - name: Validate RPM packaging skeleton
        run: MWB_VALIDATE_RPM_BUILD=1 scripts/validate-rpm-packaging.sh

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    name: ASan and UBSan
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            libx11-dev \
            libssl-dev \
            pkg-config \
            zlib1g-dev

      - name: Configure
        run: cmake -S . -B build-sanitize -DCMAKE_BUILD_TYPE=Debug -DMWB_ENABLE_SANITIZERS=ON

      - name: Build
        run: cmake --build build-sanitize --parallel

      - name: Test
        run: ctest --test-dir build-sanitize --output-on-failure

  static-checks:
    name: Static checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check trailing whitespace
        run: |
          if git grep -nI '[[:blank:]]$' -- .; then
            echo "Trailing whitespace found"
            exit 1
          fi

      - name: Check shell syntax
        run: |
          bash -n mwb-desktop-ui.sh
          bash -n scripts/inputflow-diagnostics-bundle.sh
          bash -n scripts/validate-rpm-packaging.sh

      - name: Validate RPM packaging skeleton
        run: scripts/validate-rpm-packaging.sh
